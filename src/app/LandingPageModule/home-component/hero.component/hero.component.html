<!-- HERO AREA -->
<div class="hero">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center text-white intro">
        <h6 class="hero-h6-1">{{'hero.title' | translate }}</h6>
        <h1 class="display-1 fw-bolder">{{'hero.subtitle' | translate}}</h1>
        <p>
         {{'hero.description' | translate}}
        </p>
        <h6 class="hero-h6-2 mb-4">{{'hero.title2' | translate}}</h6>
        <li class="nav-item text-center">
          <a
            class="appointment"
            (click)="bookAppointment()"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            style="cursor: pointer;"
            >{{'hero.cta' | translate}}</a
          >
        </li>
      </div>
    </div>
  </div>
</div>
